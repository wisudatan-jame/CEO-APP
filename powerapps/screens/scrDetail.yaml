Screens:
  scrDetail:
    Properties:
      Fill: =clrBg
      OnVisible: =Refresh(TicketHistory)
    Children:
      - recHeader:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrPrimary
            Height: =90
            Width: =Parent.Width
      - recHeaderLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrAccent
            Height: =4
            Width: =Parent.Width
            Y: =90
      - imgLogoD:
          Control: Image@2.2.3
          Properties:
            Image: |-
              ='df-logo-white'
            ImagePosition: =ImagePosition.Fit
            X: =16
            Y: =12
            Width: =150
            Height: =66
      - imgCEOD:
          Control: Image@2.2.3
          Properties:
            Image: |-
              ='ceo-avatar-sangngan'
            ImagePosition: =ImagePosition.Fit
            X: =Parent.Width - 80
            Y: =4
            Width: =64
            Height: =83
      - conDBody:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            PaddingTop: =12
            PaddingBottom: =16
            PaddingLeft: =20
            PaddingRight: =20
            LayoutGap: =12
            DropShadow: =DropShadow.None
            Fill: =clrBg
            BorderThickness: =0
            X: =0
            Y: =94
            Width: =Parent.Width
            Height: =Parent.Height - 94 - 96
            LayoutOverflowY: =LayoutOverflow.Scroll
          Children:
            - conDTitle:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  LayoutGap: =14
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  Height: =64
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - btnBack:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="‹"
                        OnSelect: =Navigate(scrTickets)
                        Font: =Font.'Open Sans'
                        Size: =26
                        FontWeight: =FontWeight.Bold
                        Fill: =Color.White
                        Color: =clrPrimary
                        BorderColor: =clrPrimary
                        BorderThickness: =2
                        RadiusTopLeft: =28
                        RadiusTopRight: =28
                        RadiusBottomLeft: =28
                        RadiusBottomRight: =28
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        HoverColor: =Self.Color
                        HoverBorderColor: =Self.BorderColor
                        PressedFill: =ColorFade(Self.Fill, -20%)
                        PressedColor: =Self.Color
                        PressedBorderColor: =Self.BorderColor
                        Width: =56
                        Height: =56
                        PaddingTop: =0
                        PaddingBottom: =6
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        LayoutMinWidth: =56
                  - lblDTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="T-" & varTicket.ID & " " & varTicket.Title
                        Font: =Font.'Open Sans'
                        Size: =19
                        Color: =clrPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =60
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Center
                        LayoutMinWidth: =0
            - conDStatus:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  Height: =44
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - btnDStatusPill:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =Switch(varTicket.Status.Value, "New", "ใหม่", "Acknowledged", "รับทราบแล้ว", "InProgress", "กำลังทำ", "WaitingCEO", "รอ CEO ตอบ", "Done", "รอ CEO ตรวจ", "Closed", "ปิดแล้ว", varTicket.Status.Value)
                        OnSelect: =false
                        Font: =Font.'Open Sans'
                        Size: =13
                        FontWeight: =FontWeight.Bold
                        Fill: =Switch(true, varTicket.IsOpen && varTicket.Status.Value <> "Done" && varTicket.DueDate < Today(), ColorValue("#FDE8E8"), varTicket.Status.Value = "WaitingCEO", ColorValue("#E9E9F5"), varTicket.Status.Value = "Done", ColorValue("#E3F4EA"), varTicket.Status.Value = "New", ColorValue("#EEF0F4"), ColorValue("#F1F2F6"))
                        Color: =Switch(true, varTicket.IsOpen && varTicket.Status.Value <> "Done" && varTicket.DueDate < Today(), clrDanger, varTicket.Status.Value = "WaitingCEO", clrPrimary, varTicket.Status.Value = "Done", ColorValue("#17703A"), varTicket.Status.Value = "New", ColorValue("#3F4A5C"), ColorValue("#3F4A5C"))
                        BorderColor: =clrAccent
                        BorderThickness: =0
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        HoverFill: =Self.Fill
                        HoverColor: =Self.Color
                        HoverBorderColor: =Self.BorderColor
                        PressedFill: =Self.Fill
                        PressedColor: =Self.Color
                        PressedBorderColor: =Self.BorderColor
                        PaddingLeft: =8
                        PaddingRight: =8
                        Width: =Len(Self.Text) * 11 + 40
                        Height: =40
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                  - lblDStatusDue:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="ส่ง " & Text(varTicket.DueDate, "dddd d mmm", "th-TH") & If(!varTicket.IsOpen, "", varTicket.DueDate < Today(), " · เลย " & DateDiff(varTicket.DueDate, Today()) & " วัน", varTicket.DueDate = Today(), " · วันนี้", " · อีก " & DateDiff(Today(), varTicket.DueDate) & " วัน")
                        Font: =Font.'Open Sans'
                        Size: =13
                        Color: =If(varTicket.IsOpen && varTicket.Status.Value <> "Done" && varTicket.DueDate < Today(), clrDanger, clrMuted)
                        Height: =40
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
            - conDInfo:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  LayoutGap: =6
                  DropShadow: =DropShadow.None
                  Fill: =Color.White
                  BorderThickness: =2
                  BorderColor: =clrLine
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =conDFrom.Height + 6 + conDWhen.Height + If(conDDetails.Visible, 6 + conDDetails.Height, 0) + If(conDExtra.Visible, 6 + conDExtra.Height, 0) + 28 + 4
                Children:
                  - conDFrom:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =lblDFrom.Height + 0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblDFromK:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="ผู้สั่ง"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrMuted
                              Width: =140
                              FontWeight: =FontWeight.Normal
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =140
                        - lblDFrom:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="คุณสมชาย (CEO)"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrText
                              AutoHeight: =true
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                  - conDWhen:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =lblDWhen.Height + 0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblDWhenK:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="สั่งเมื่อ"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrMuted
                              Width: =140
                              FontWeight: =FontWeight.Normal
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =140
                        - lblDWhen:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(varTicket.Created, "d mmm hh:mm", "th-TH")
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrText
                              AutoHeight: =true
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                  - conDDetails:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =lblDDetails.Height + 0
                        Visible: =!IsBlank(varTicket.Details)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblDDetailsK:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="รายละเอียด"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrMuted
                              Width: =140
                              FontWeight: =FontWeight.Normal
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =140
                        - lblDDetails:
                            Control: Label@2.5.1
                            Properties:
                              Text: =varTicket.Details
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrText
                              AutoHeight: =true
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                  - conDExtra:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        PaddingTop: =8
                        PaddingBottom: =8
                        PaddingLeft: =10
                        PaddingRight: =10
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =ColorFade(clrAccent, 92%)
                        BorderThickness: =2
                        Height: =lblDExtra.Height + 16
                        BorderColor: =ColorFade(clrAccent, 50%)
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        Visible: =!IsBlank(varTicket.CEOExtra)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblDExtraK:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="สั่งเพิ่ม"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrDanger
                              Width: =140
                              FontWeight: =FontWeight.Semibold
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =140
                        - lblDExtra:
                            Control: Label@2.5.1
                            Properties:
                              Text: =varTicket.CEOExtra
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrText
                              AutoHeight: =true
                              VerticalAlign: =VerticalAlign.Top
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
            - conDFiles:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  LayoutGap: =8
                  DropShadow: =DropShadow.None
                  Fill: =Color.White
                  BorderThickness: =2
                  BorderColor: =clrLine
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =34 + 8 + If(lblSentFiles.Visible, lblSentFiles.Height + 8, 0) + 96 + 8 + 56 + 28 + 4
                Children:
                  - conDFileHead:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =34
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblDFilesHead:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="ไฟล์ที่ส่งแล้ว (" & CountRows(Filter(galHistory.AllItems, StartsWith(Comment, "📎 แนบไฟล์"))) & ")"
                              Font: =Font.'Open Sans'
                              Size: =15
                              Color: =clrText
                              Height: =34
                              FontWeight: =FontWeight.Bold
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =0
                        - btnPhotos:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: ="เปิดโฟลเดอร์"
                              OnSelect: =Launch("https://digitalfocusth.sharepoint.com/sites/CEO-Tickets/TicketFiles/Forms/AllItems.aspx?id=" & EncodeUrl("/sites/CEO-Tickets/TicketFiles/T-" & varTicket.ID))
                              Font: =Font.'Open Sans'
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Fill: =Color.Transparent
                              Color: =clrPrimary
                              BorderColor: =clrAccent
                              BorderThickness: =0
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              HoverFill: =Color.Transparent
                              HoverColor: =clrAccent
                              HoverBorderColor: =Self.BorderColor
                              PressedFill: =Color.Transparent
                              PressedColor: =Self.Color
                              PressedBorderColor: =Self.BorderColor
                              Width: =190
                              Height: =34
                              Align: =Align.Right
                              PaddingRight: =0
                              DisabledFill: =Color.Transparent
                              DisabledColor: =ColorFade(clrPrimary, 60%)
                              DisplayMode: =If(varTicket.HasFiles, DisplayMode.Edit, DisplayMode.Disabled)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =190
                  - lblSentFiles:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =Concat(
                              Filter(galHistory.AllItems, StartsWith(Comment, "📎 แนบไฟล์")),
                              "• " & Mid(Comment, Find(": ", Comment) + 18) & "  (" & Text(Created, "d mmm hh:mm", "th-TH") & ")",
                              Char(10))
                        Font: =Font.'Open Sans'
                        Size: =13
                        Color: =clrPrimary
                        AutoHeight: =true
                        Visible: =CountRows(Filter(galHistory.AllItems, StartsWith(Comment, "📎 แนบไฟล์"))) > 0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                  - attFiles:
                      Control: Attachments@2.3.0
                      Properties:
                        Items: =Blank()
                        MaxAttachments: =5
                        MaxAttachmentSize: =10
                        NoAttachmentsText: =""
                        AddAttachmentText: ="เลือกไฟล์ (Excel, PDF, Word, รูป · ไม่เกิน 5 ไฟล์ ไฟล์ละ 10 MB)"
                        DisplayMode: =If(varTicket.IsOpen, DisplayMode.Edit, DisplayMode.Disabled)
                        Font: =Font.'Open Sans'
                        Size: =13
                        Color: =clrText
                        Fill: =Color.White
                        BorderColor: =clrLine
                        BorderThickness: =2
                        BorderStyle: =BorderStyle.Dashed
                        Height: =96
                        ItemFill: =clrBg
                        ItemColor: =clrText
                        ItemHoverFill: =clrLine
                        HoverFill: =clrBg
                        PaddingTop: =5
                        PaddingBottom: =5
                        PaddingLeft: =5
                        PaddingRight: =5
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Start
                        Width: =Parent.Width - 40
                  - btnUpload:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="ส่งไฟล์"
                        OnSelect: |-
                          =Set(varBusy, true);
                          Set(varUpload,
                              ForAll(attFiles.Attachments As f,
                                  AttachTicketFile.Run(varTicket.ID, {contentBytes: f.Value, name: f.Name})));
                          Set(varBusy, false);
                          If(CountIf(varUpload, Lower(ok) = "true") = CountRows(varUpload),
                              Notify("ส่งไฟล์แล้ว " & CountRows(varUpload) & " ไฟล์", NotificationType.Success); Reset(attFiles),
                              Notify("ส่งไม่สำเร็จบางไฟล์: " & First(Filter(varUpload, Lower(ok) <> "true")).message, NotificationType.Error));
                          Refresh(Tickets);
                          Refresh(TicketHistory);
                          Set(varTicket, LookUp(Tickets, ID = varTicket.ID))
                        Font: =Font.'Open Sans'
                        Size: =15
                        FontWeight: =FontWeight.Bold
                        Fill: =clrAccent
                        Color: =Color.White
                        BorderColor: =clrAccent
                        BorderThickness: =0
                        RadiusTopLeft: =14
                        RadiusTopRight: =14
                        RadiusBottomLeft: =14
                        RadiusBottomRight: =14
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        HoverColor: =Self.Color
                        HoverBorderColor: =Self.BorderColor
                        PressedFill: =ColorFade(Self.Fill, -20%)
                        PressedColor: =Self.Color
                        PressedBorderColor: =Self.BorderColor
                        Height: =56
                        DisplayMode: =If(varBusy || IsEmpty(attFiles.Attachments) || !varTicket.IsOpen, DisplayMode.Disabled, DisplayMode.Edit)
                        DisabledFill: =ColorFade(clrAccent, 60%)
                        DisabledColor: =Color.White
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
            - conDHist:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  LayoutGap: =10
                  DropShadow: =DropShadow.None
                  Fill: =Color.White
                  BorderThickness: =2
                  BorderColor: =clrLine
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =34 + 10 + galHistory.Height + 28 + 4
                Children:
                  - lblHistHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="ความเคลื่อนไหวล่าสุด"
                        Font: =Font.'Open Sans'
                        Size: =15
                        Color: =clrText
                        Height: =34
                        FontWeight: =FontWeight.Bold
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                  - galHistory:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Items: =SortByColumns(Filter(TicketHistory, TicketID = varTicket.ID), "ID", SortOrder.Descending)
                        TemplateSize: =56
                        Fill: =Color.Transparent
                        Height: =Min(Max(CountRows(Self.AllItems), 1), 5) * Self.TemplateHeight
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblHistWhen:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(ThisItem.Created, "d mmm hh:mm", "th-TH")
                              Font: =Font.'Open Sans'
                              Size: =12
                              Color: =clrMuted
                              X: =0
                              Y: =0
                              Width: =156
                              Height: =Parent.TemplateHeight - 1
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =12
                              OnSelect: =Select(Parent)
                        - lblHist:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =Switch(ThisItem.Action.Value, "create", "CEO สั่งงาน", "ack", "รับทราบ", "start", "เริ่มทำ", "wait", "ถาม CEO", "reply", "CEO ตอบ", "done", "ทำเสร็จ", "reopen", "CEO ส่งกลับ", "close", "CEO ปิดงาน", "cancel", "ยกเลิกงาน", "comment", "ความเห็น", "due_change", "เลื่อนวันส่ง", "reassign", "โอนงาน", ThisItem.Action.Value) & If(IsBlank(ThisItem.Comment), "", ": " & ThisItem.Comment)
                              Font: =Font.'Open Sans'
                              Size: =12
                              Color: =clrText
                              X: =164
                              Y: =0
                              Width: =Parent.TemplateWidth - 164
                              Height: =Parent.TemplateHeight - 1
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =12
                              OnSelect: =Select(Parent)
                        - recHistLine:
                            Control: Rectangle@2.3.0
                            Properties:
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =1
                              Fill: =clrLine
                              OnSelect: =Select(Parent)
            - conDAction:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingTop: =14
                  PaddingBottom: =14
                  PaddingLeft: =18
                  PaddingRight: =18
                  LayoutGap: =10
                  DropShadow: =DropShadow.None
                  Fill: =Color.White
                  BorderThickness: =2
                  BorderColor: =clrLine
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =70 + 64 + 56 + 2 * 10 + 28 + 4
                Children:
                  - txtComment:
                      Control: Classic/TextInput@2.3.2
                      Properties:
                        Default: =""
                        Mode: =TextMode.MultiLine
                        Height: =70
                        Font: =Font.'Open Sans'
                        Size: =14
                        HintText: ="ข้อความถึง CEO (ถาม CEO / ส่งความเห็น ต้องพิมพ์ก่อน) เช่น รับทราบค่ะ จะเริ่มพรุ่งนี้"
                        BorderColor: =clrLine
                        BorderThickness: =2
                        Fill: =Color.White
                        HoverFill: =Color.White
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                  - conDBig:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
