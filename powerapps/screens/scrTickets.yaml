Screens:
  scrTickets:
    Properties:
      Fill: =clrBg
    Children:
      - recTop:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrPrimary
            Height: =90
            Width: =Parent.Width
      - recTopLine:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrAccent
            Height: =4
            Width: =Parent.Width
            Y: =90
      - imgLogo:
          Control: Image@2.2.3
          Properties:
            Image: |-
              ='df-logo-white'
            ImagePosition: =ImagePosition.Fit
            X: =16
            Y: =12
            Width: =150
            Height: =66
      - imgCEO:
          Control: Image@2.2.3
          Properties:
            Image: |-
              ='ceo-avatar-sangngan'
            ImagePosition: =ImagePosition.Fit
            X: =Parent.Width - 80
            Y: =4
            Width: =64
            Height: =83
      - lblHeader:
          Control: Label@2.5.1
          Properties:
            Text: ="งานจาก CEO"
            Font: =Font.'Open Sans'
            Size: =20
            Color: =clrPrimary
            X: =24
            Y: =104
            Width: =Parent.Width - 48
            Height: =52
            FontWeight: =FontWeight.Bold
      - conTickets:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            DropShadow: =DropShadow.None
            Fill: =Color.Transparent
            BorderThickness: =0
            X: =24
            Y: =160
            Width: =Parent.Width - 48
            Height: =Parent.Height - 96 - 104 - Self.Y
          Children:
            - lblEmpty:
                Control: Label@2.5.1
                Properties:
                  Text: ="ไม่มีงานค้าง"
                  Font: =Font.'Open Sans'
                  Size: =14
                  Color: =clrMuted
                  Height: =50
                  Visible: =IsEmpty(galTickets.AllItems)
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
            - galTickets:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Items: =SortByColumns(Filter(Tickets, IsOpen = true, AssigneeEmail = varMe), "DueDate", SortOrder.Ascending)
                  TemplateSize: =102
                  OnSelect: =Set(varTicket, ThisItem); Navigate(scrDetail)
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnTicketRow:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =""
                        OnSelect: =Select(Parent)
                        Font: =Font.'Open Sans'
                        Size: =15
                        FontWeight: =FontWeight.Semibold
                        Fill: =Color.White
                        Color: =Color.White
                        BorderColor: =clrLine
                        BorderThickness: =2
                        RadiusTopLeft: =18
                        RadiusTopRight: =18
                        RadiusBottomLeft: =18
                        RadiusBottomRight: =18
                        HoverFill: =clrBg
                        HoverColor: =Self.Color
                        HoverBorderColor: =Self.BorderColor
                        PressedFill: =clrLine
                        PressedColor: =Self.Color
                        PressedBorderColor: =Self.BorderColor
                        X: =0
                        Y: =0
                        Width: =Parent.TemplateWidth
                        Height: =Parent.TemplateHeight - 12
                  - lblTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="T-" & ThisItem.ID & " " & ThisItem.Title
                        Font: =Font.'Open Sans'
                        Size: =15
                        Color: =clrText
                        X: =20
                        Y: =10
                        Width: =Parent.TemplateWidth - 40
                        Height: =36
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Select(Parent)
                  - lblMeta:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If(ThisItem.DueDate < Today(), "เลยกำหนด " & DateDiff(ThisItem.DueDate, Today()) & " วัน", "ส่ง " & Text(ThisItem.DueDate, "ddd d mmm", "th-TH"))
                        Font: =Font.'Open Sans'
                        Size: =12
                        Color: =If(ThisItem.DueDate < Today(), clrDanger, clrMuted)
                        X: =20
                        Y: =48
                        Width: =Parent.TemplateWidth - 230
                        Height: =30
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Select(Parent)
                  - lblStatus:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Switch(ThisItem.Status.Value, "New", "ใหม่", "Acknowledged", "รับทราบ", "InProgress", "กำลังทำ", "WaitingCEO", "รอ CEO ตอบ", "Done", "รอ CEO ตรวจ", ThisItem.Status.Value)
                        Font: =Font.'Open Sans'
                        Size: =12
                        Color: =clrPrimary
                        X: =Parent.TemplateWidth - 210
                        Y: =48
                        Width: =190
                        Height: =30
                        Align: =Align.Right
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Select(Parent)
      - btnRefresh:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="รีเฟรช"
            OnSelect: =Refresh(Tickets)
            Font: =Font.'Open Sans'
            Size: =16
            FontWeight: =FontWeight.Bold
            Fill: =clrAccent
            Color: =Color.White
            BorderColor: =clrAccent
            BorderThickness: =0
            RadiusTopLeft: =16
            RadiusTopRight: =16
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            HoverFill: =ColorFade(Self.Fill, -10%)
            HoverColor: =Self.Color
            HoverBorderColor: =Self.BorderColor
            PressedFill: =ColorFade(Self.Fill, -20%)
            PressedColor: =Self.Color
            PressedBorderColor: =Self.BorderColor
            X: =24
            Y: =Parent.Height - 96 - 92
            Width: =Parent.Width - 48
            Height: =80
      - recTabLineT:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrLine
            X: =0
            Y: =Parent.Height - 96
            Width: =Parent.Width
            Height: =2
      - btnTabHomeT:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="ภาพรวม"
            OnSelect: =Navigate(scrHome)
            Font: =Font.'Open Sans'
            Size: =13
            FontWeight: =FontWeight.Normal
            Fill: =Color.White
            Color: =clrMuted
            BorderColor: =clrAccent
            BorderThickness: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            HoverFill: =clrBg
            HoverColor: =Self.Color
            HoverBorderColor: =Self.BorderColor
            PressedFill: =clrLine
            PressedColor: =Self.Color
            PressedBorderColor: =Self.BorderColor
            X: =0
            Y: =Parent.Height - 96 + 2
            Width: =Parent.Width / 2
            Height: =94
            VerticalAlign: =VerticalAlign.Bottom
            PaddingBottom: =12
      - icoTabHomeT:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.Home
            Color: =clrMuted
            OnSelect: =Navigate(scrHome)
            X: =(Parent.Width / 2 - 34) / 2
            Y: =Parent.Height - 96 + 14
            Width: =34
            Height: =34
      - btnTabListT:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="งานจาก CEO"
            OnSelect: =Navigate(scrTickets)
            Font: =Font.'Open Sans'
            Size: =13
            FontWeight: =FontWeight.Bold
            Fill: =Color.White
            Color: =clrAccent
            BorderColor: =clrAccent
            BorderThickness: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            HoverFill: =clrBg
            HoverColor: =Self.Color
            HoverBorderColor: =Self.BorderColor
            PressedFill: =clrLine
            PressedColor: =Self.Color
            PressedBorderColor: =Self.BorderColor
            X: =Parent.Width * 1 / 2
            Y: =Parent.Height - 96 + 2
            Width: =Parent.Width / 2
            Height: =94
            VerticalAlign: =VerticalAlign.Bottom
            PaddingBottom: =12
      - icoTabListT:
          Control: Classic/Icon@2.5.0
          Properties:
            Icon: =Icon.DetailList
            Color: =clrAccent
            OnSelect: =Navigate(scrTickets)
            X: =Parent.Width * 1 / 2 + (Parent.Width / 2 - 34) / 2
            Y: =Parent.Height - 96 + 14
            Width: =34
            Height: =34
