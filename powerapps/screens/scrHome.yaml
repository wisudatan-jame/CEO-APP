      - conTodo:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            PaddingTop: =12
            PaddingBottom: =8
            PaddingLeft: =18
            PaddingRight: =18
            LayoutGap: =6
            DropShadow: =DropShadow.None
            Fill: =Color.White
            BorderThickness: =2
            BorderColor: =clrLine
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            X: =24
            Y: =500
            Width: =Parent.Width - 48
            Height: =Parent.Height - 96 - 12 - 140 - 12 - Self.Y
          Children:
            - lblTodoHead:
                Control: Label@2.5.1
                Properties:
                  Text: ="ต้องทำก่อน"
                  Font: =Font.'Open Sans'
                  Size: =15
                  Color: =clrText
                  Height: =34
                  FontWeight: =FontWeight.Bold
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
            - lblTodoEmpty:
                Control: Label@2.5.1
                Properties:
                  Text: ="ไม่มีงานค้าง"
                  Font: =Font.'Open Sans'
                  Size: =13
                  Color: =clrMuted
                  Height: =40
                  Visible: =IsEmpty(galTodo.AllItems)
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
            - galTodo:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Items: =FirstN(SortByColumns(Filter(varOpen, Status.Value <> "Done"), "DueDate", SortOrder.Ascending), 4)
                  TemplateSize: =72
                  ShowScrollbar: =false
                  OnSelect: =Set(varTicket, ThisItem); Navigate(scrDetail)
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - recTodoBar:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =0
                        Y: =16
                        Width: =8
                        Height: =Parent.TemplateHeight - 32
                        Fill: =If(ThisItem.DueDate < Today(), clrAccent, clrPrimary)
                        OnSelect: =Select(Parent)
                  - lblTodo:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="T-" & ThisItem.ID & " " & ThisItem.Title
                        Font: =Font.'Open Sans'
                        Size: =14
                        Color: =clrText
                        X: =22
                        Y: =6
                        Width: =Parent.TemplateWidth - 22
                        Height: =34
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Select(Parent)
                  - lblTodoSub:
                      Control: Label@2.5.1
                      Properties:
                        Text: |-
                          =If(ThisItem.DueDate < Today(), "เลย " & DateDiff(ThisItem.DueDate, Today()) & " วัน", "ส่ง " & Text(ThisItem.DueDate, "ddd d mmm", "th-TH")) &
                          " · " & Switch(ThisItem.Status.Value, "New", "ใหม่ ยังไม่รับทราบ", "Acknowledged", "รับทราบ", "InProgress", "กำลังทำ", "WaitingCEO", "รอ CEO ตอบ", ThisItem.Status.Value)
                        Font: =Font.'Open Sans'
                        Size: =12
                        Color: =If(ThisItem.DueDate < Today(), clrDanger, clrMuted)
                        X: =22
                        Y: =38
                        Width: =Parent.TemplateWidth - 22
                        Height: =28
                        OnSelect: =Select(Parent)
                  - recTodoLine:
                      Control: Rectangle@2.3.0
                      Properties:
                        X: =0
                        Y: =Parent.TemplateHeight - 1
                        Width: =Parent.TemplateWidth
                        Height: =1
                        Fill: =clrLine
                        OnSelect: =Select(Parent)
