      - btnTabNewCT:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="สั่งงาน"
            OnSelect: =Navigate(scrCeoCreate)
            Font: =Font.'Open Sans'
            Size: =13
            FontWeight: =FontWeight.Normal
            Fill: =Color.White
            Color: =clrMuted
            BorderColor: =clrAccent
            BorderThickness: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            HoverFill: =clrBg
            HoverColor: =Self.Color
            HoverBorderColor: =Self.BorderColor
            PressedFill: =clrLine
            PressedColor: =Self.Color
            PressedBorderColor: =Self.BorderColor
            X: =Parent.Width * 2 / 3
            Y: =Parent.Height - 96 + 2
            Width: =Parent.Width / 3
