      - conCPeople:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =6
            DropShadow: =DropShadow.None
            Fill: =Color.White
            BorderThickness: =2
            BorderColor: =clrLine
            RadiusTopLeft: =20
            RadiusTopRight: =20
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            PaddingTop: =12
            PaddingBottom: =8
            PaddingLeft: =18
            PaddingRight: =18
            X: =24
            Y: =500
            Width: =Parent.Width - 48
            Height: =Parent.Height - 96 - 12 - If(conCGroups.Visible, 150 + 12, 0) - Self.Y
          Children:
            - conCPeopleHead:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  Height: =34
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - lblCPeopleHead:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="รายคน"
                        Font: =Font.'Open Sans'
                        Size: =15
                        Color: =clrText
                        Height: =34
                        FontWeight: =FontWeight.Bold
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =0
                  - lblCPeopleCols:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="เปิด · ช้า · เฉลี่ย"
                        Font: =Font.'Open Sans'
                        Size: =12
                        Color: =clrMuted
                        Width: =220
                        Height: =34
                        Align: =Align.Right
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutMinWidth: =220
            - galCPeople:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Items: |-
                    =SortByColumns(
                        AddColumns(GroupBy(colAll, AssigneeEmail, Rows),
                            OpenCount, CountRows(Rows),
                            LateCount, CountRows(Filter(Rows, Status.Value <> "Done", DueDate < Today())),
                            AvgDays, With({who: AssigneeEmail},
                                With({d: Filter(varClosed30, AssigneeEmail = who, !IsBlank(DoneAt))},
                                    If(CountRows(d) > 0, Average(d, DateDiff(Created, DoneAt, TimeUnit.Hours)) / 24, 0)))),
                        "LateCount", SortOrder.Descending, "OpenCount", SortOrder.Descending)
                  TemplateSize: =76
                  OnSelect: =Set(varFilter, "person"); Set(varPerson, ThisItem.AssigneeEmail); Navigate(scrCeoTickets)
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  FillPortions: =1
                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnCPInit:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: |-
                          =With({n: Coalesce(LookUp(colEmp, Lower(Email) = ThisItem.AssigneeEmail).Nickname, ThisItem.AssigneeEmail)}, If(Left(n, 1) in ["เ", "แ", "โ", "ใ", "ไ"], Mid(n, 2, 1), Left(n, 1)))
                        OnSelect: =Select(Parent)
                        Font: =Font.'Open Sans'
                        Size: =15
                        FontWeight: =FontWeight.Bold
                        Fill: =ColorFade(clrPrimary, 88%)
                        Color: =clrPrimary
                        BorderColor: =clrAccent
                        BorderThickness: =0
                        RadiusTopLeft: =26
                        RadiusTopRight: =26
                        RadiusBottomLeft: =26
                        RadiusBottomRight: =26
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        HoverColor: =Self.Color
                        HoverBorderColor: =Self.BorderColor
                        PressedFill: =ColorFade(Self.Fill, -20%)
                        PressedColor: =Self.Color
                        PressedBorderColor: =Self.BorderColor
                        X: =0
                        Y: =12
                        Width: =52
                        Height: =52
                  - lblCPName:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Coalesce(LookUp(colEmp, Lower(Email) = ThisItem.AssigneeEmail).Nickname, ThisItem.AssigneeEmail)
                        Font: =Font.'Open Sans'
                        Size: =14
                        Color: =clrText
                        X: =66
                        Y: =8
                        Width: =Parent.TemplateWidth - 66 - 200
                        Height: =32
                        FontWeight: =FontWeight.Semibold
                        OnSelect: =Select(Parent)
                  - lblCPDept:
                      Control: Label@2.5.1
                      Properties:
                        Text: =Coalesce(LookUp(colEmp, Lower(Email) = ThisItem.AssigneeEmail).Department, "ไม่พบในรายชื่อพนักงาน")
                        Font: =Font.'Open Sans'
                        Size: =12
                        Color: =clrMuted
                        X: =66
                        Y: =40
                        Width: =Parent.TemplateWidth - 66 - 200
                        Height: =28
                        OnSelect: =Select(Parent)
                  - lblCPOpen:
                      Control: Label@2.5.1
                      Properties:
                        Text: =ThisItem.OpenCount
                        Font: =Font.'Open Sans'
                        Size: =13
                        Color: =clrText
                        Y: =0
                        Height: =Parent.TemplateHeight - 1
                        Align: =Align.Right
                        OnSelect: =Select(Parent)
                        X: =Parent.TemplateWidth - 196
                        Width: =50
                  - lblCPLate:
