                        Text: =ThisItem.LateCount
                        Font: =Font.'Open Sans'
                        Size: =13
                        Color: =If(ThisItem.LateCount > 0, clrDanger, clrMuted)
                        Y: =0
                        Height: =Parent.TemplateHeight - 1
                        Align: =Align.Right
                        OnSelect: =Select(Parent)
                        X: =Parent.TemplateWidth - 140
                        Width: =50
                        FontWeight: =FontWeight.Bold
                  - lblCPAvg:
                      Control: Label@2.5.1
