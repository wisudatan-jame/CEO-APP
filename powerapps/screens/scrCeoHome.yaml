                        Text: =If(ThisItem.AvgDays > 0, Text(ThisItem.AvgDays, "0.0") & " วัน", "-")
                        Font: =Font.'Open Sans'
                        Size: =12
                        Color: =clrMuted
                        Y: =0
                        Height: =Parent.TemplateHeight - 1
                        Align: =Align.Right
                        OnSelect: =Select(Parent)
                        X: =Parent.TemplateWidth - 84
                        Width: =84
                  - recCPLine:
