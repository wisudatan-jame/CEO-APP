            FontWeight: =FontWeight.Bold
            Color: =clrPrimary
            Fill: =Color.White
            PaddingLeft: =If(IsEmpty(Self.Attachments), (Self.Width - 250) / 2, 12)
            PaddingTop: =If(IsEmpty(Self.Attachments), 0, 8)
            PaddingBottom: =If(IsEmpty(Self.Attachments), Max(0, (Self.Height - 90) / 2), 8)
            BorderColor: =clrLine
