                        Y: =4
                        Width: =Parent.TemplateWidth - 8
                        Height: =Parent.TemplateHeight - 8
                        DisplayMode: =If(varNMgr, DisplayMode.Disabled, DisplayMode.Edit)
                        DisabledFill: =clrBg
                        DisabledColor: =clrMuted
                        DisabledBorderColor: =clrLine
      - btnNMgr:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="หัวหน้า/ผู้จัดการ"
            OnSelect: =Set(varNMgr, !varNMgr)
            Font: =Font.'Open Sans'
            Size: =12
            FontWeight: =FontWeight.Semibold
            Fill: =If(varNMgr, clrPrimary, Color.White)
            Color: =If(varNMgr, Color.White, clrPrimary)
            BorderColor: =clrLine
            BorderThickness: =2
            RadiusTopLeft: =26
            RadiusTopRight: =26
            RadiusBottomLeft: =26
            RadiusBottomRight: =26
            HoverFill: =ColorFade(Self.Fill, -10%)
            HoverColor: =Self.Color
            HoverBorderColor: =Self.BorderColor
            PressedFill: =ColorFade(Self.Fill, -20%)
            PressedColor: =Self.Color
            PressedBorderColor: =Self.BorderColor
            Height: =54
            X: =24 + Mod(CountRows(galNWho.AllItems) + 0, 3) * (Parent.Width - 48) / 3 + 4
            Y: =480 + RoundDown((CountRows(galNWho.AllItems) + 0) / 3, 0) * 62 + 4
