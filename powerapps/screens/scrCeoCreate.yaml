      - attNew:
          Control: Attachments@2.3.0
          Properties:
            Items: =Blank()
            MaxAttachments: =5
            MaxAttachmentSize: =10
            NoAttachmentsText: =""
            DisplayMode: =DisplayMode.Edit
            AddAttachmentText: ="แนบรูปหรือไฟล์"
