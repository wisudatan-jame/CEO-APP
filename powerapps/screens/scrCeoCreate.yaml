            Y: =lblNWhenHead.Y + 38
            Width: =(Parent.Width - 48 - 36) / 4
      - btnNDayPick:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =If(!(varNDue in [Today(), DateAdd(Today(), 1, TimeUnit.Days), DateAdd(Today(), Mod(6 - Weekday(Today()), 7), TimeUnit.Days)]), (Text(varNDue, "ddd", "th-TH") & " " & Day(varNDue) & " " & Index(["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."], Month(varNDue)).Value), "เลือกวัน…")
            OnSelect: =Set(varNPickAll, false); Set(varCalMonth, Date(Year(varNDue), Month(varNDue), 1)); Set(varNCal, true)
            Font: =Font.'Open Sans'
            Size: =14
            FontWeight: =FontWeight.Semibold
            Fill: =If(!(varNDue in [Today(), DateAdd(Today(), 1, TimeUnit.Days), DateAdd(Today(), Mod(6 - Weekday(Today()), 7), TimeUnit.Days)]), clrPrimary, Color.White)
            Color: =If(!(varNDue in [Today(), DateAdd(Today(), 1, TimeUnit.Days), DateAdd(Today(), Mod(6 - Weekday(Today()), 7), TimeUnit.Days)]), Color.White, clrPrimary)
            BorderColor: =clrLine
