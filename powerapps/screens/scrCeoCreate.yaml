                        OnSelect: =If(!IsBlank(LookUp(colPick, Email = ThisItem.Email)), Remove(colPick, LookUp(colPick, Email = ThisItem.Email)), Collect(colPick, ThisItem))
                        Font: =Font.'Open Sans'
                        Size: =12
                        FontWeight: =FontWeight.Semibold
