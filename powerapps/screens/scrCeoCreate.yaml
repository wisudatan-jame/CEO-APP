          Control: Classic/Button@2.2.0
          Properties:
            Text: ="จันทร์หน้า"
            OnSelect: =Set(varNDue, DateAdd(Today(), If(Mod(9 - Weekday(Today()), 7) = 0, 7, Mod(9 - Weekday(Today()), 7)), TimeUnit.Days))
            Font: =Font.'Open Sans'
            Size: =14
            FontWeight: =FontWeight.Semibold
            Fill: =If(varNDue = DateAdd(Today(), If(Mod(9 - Weekday(Today()), 7) = 0, 7, Mod(9 - Weekday(Today()), 7)), TimeUnit.Days), clrPrimary, Color.White)
            Color: =If(varNDue = DateAdd(Today(), If(Mod(9 - Weekday(Today()), 7) = 0, 7, Mod(9 - Weekday(Today()), 7)), TimeUnit.Days), Color.White, clrPrimary)
