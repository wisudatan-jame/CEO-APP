                  AlignInContainer: =AlignInContainer.Stretch
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                Children:
                  - btnNWho:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =Coalesce(ThisItem.Nickname, ThisItem.FirstName) & If(IsBlank(ThisItem.Department), "", " (" & ThisItem.Department & ")")
                        OnSelect: =If(!IsBlank(LookUp(colPick, Email = ThisItem.Email)), Remove(colPick, LookUp(colPick, Email = ThisItem.Email)), Collect(colPick, ThisItem))
                        Font: =Font.'Open Sans'
                        Size: =12
                        FontWeight: =FontWeight.Semibold
                        Fill: =If(!IsBlank(LookUp(colPick, Email = ThisItem.Email)), clrPrimary, Color.White)
                        Color: =If(!IsBlank(LookUp(colPick, Email = ThisItem.Email)), Color.White, clrPrimary)
                        BorderColor: =If(!IsBlank(LookUp(colPick, Email = ThisItem.Email)), clrPrimary, clrLine)
                        BorderThickness: =2
                        RadiusTopLeft: =27
                        RadiusTopRight: =27
                        RadiusBottomLeft: =27
                        RadiusBottomRight: =27
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        HoverColor: =Self.Color
                        HoverBorderColor: =Self.BorderColor
                        PressedFill: =ColorFade(Self.Fill, -20%)
                        PressedColor: =Self.Color
                        PressedBorderColor: =Self.BorderColor
