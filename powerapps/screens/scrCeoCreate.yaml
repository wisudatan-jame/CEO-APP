            X: =24
            Y: =480
            Width: =Parent.Width - 48
            Height: =RoundUp(CountRows(galNWho.AllItems) / 3, 0) * 62
          Children:
            - galNWho:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  Items: =SortByColumns(Filter(colEmp As e, Lower(e.Email) in varFreq.AssigneeEmail || !IsBlank(LookUp(colPick, Email = e.Email))), "Nickname", SortOrder.Ascending)
                  TemplateSize: =62
                  WrapCount: =3
                  ShowScrollbar: =false
                  Fill: =Color.Transparent
                  BorderThickness: =0
