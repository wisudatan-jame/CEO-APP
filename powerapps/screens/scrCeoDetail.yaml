Screens:
  scrCeoDetail:
    Properties:
      Fill: =clrBg
      OnVisible: |-
        =Set(varPickDue, false);
        If(IsEmpty(colEmp), ClearCollect(colEmp, Filter(Employees, Active = true)));
        Refresh(TicketHistory);
        Set(varHist, SortByColumns(Filter(TicketHistory, TicketID = varTicket.ID), "ID", SortOrder.Descending)); Set(varHistPos, 0)
    Children:
      - recTopCD:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrPrimary
            Height: =90
            Width: =Parent.Width
      - recTopLineCD:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =clrAccent
            Height: =4
            Width: =Parent.Width
            Y: =90
      - imgLogoCD:
          Control: Image@2.2.3
          Properties:
            Image: |-
              ='df-logo-white'
            ImagePosition: =ImagePosition.Fit
            X: =16
            Y: =12
            Width: =150
            Height: =66
      - imgCEOCD:
          Control: Image@2.2.3
          Properties:
            Image: |-
              ='ceo-avatar-sangngan'
            ImagePosition: =ImagePosition.Fit
            X: =Parent.Width - 80
            Y: =4
            Width: =64
            Height: =83
      - conCDBody:
          Control: GroupContainer@1.3.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            PaddingTop: =12
            PaddingBottom: =16
            PaddingLeft: =20
            PaddingRight: =20
            LayoutGap: =10
            DropShadow: =DropShadow.None
            Fill: =clrBg
            BorderThickness: =0
            X: =0
            Y: =94
            Width: =Parent.Width
            Height: =Parent.Height - 94 - 96
            LayoutOverflowY: =LayoutOverflow.Scroll
          Children:
            - conCDTitle:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  LayoutGap: =14
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  Height: =58
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - btnCBack:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: ="‹"
                        OnSelect: =Navigate(scrCeoTickets)
                        Font: =Font.'Open Sans'
                        Size: =26
                        FontWeight: =FontWeight.Bold
                        Fill: =Color.White
                        Color: =clrPrimary
                        BorderColor: =clrPrimary
                        BorderThickness: =2
                        RadiusTopLeft: =28
                        RadiusTopRight: =28
                        RadiusBottomLeft: =28
                        RadiusBottomRight: =28
                        HoverFill: =ColorFade(Self.Fill, -10%)
                        HoverColor: =Self.Color
                        HoverBorderColor: =Self.BorderColor
                        PressedFill: =ColorFade(Self.Fill, -20%)
                        PressedColor: =Self.Color
                        PressedBorderColor: =Self.BorderColor
                        Width: =56
                        Height: =56
                        PaddingTop: =0
                        PaddingBottom: =6
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        LayoutMinWidth: =56
                        LayoutMinHeight: =0
                  - lblCDTitle:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="T-" & varTicket.ID & " " & varTicket.Title
                        Font: =Font.'Open Sans'
                        Size: =19
                        Color: =clrPrimary
                        FontWeight: =FontWeight.Bold
                        Height: =60
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Center
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
            - conCDStatus:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  PaddingTop: =0
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  LayoutGap: =12
                  DropShadow: =DropShadow.None
                  Fill: =Color.Transparent
                  BorderThickness: =0
                  Height: =40
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                Children:
                  - btnCDStatusPill:
                      Control: Classic/Button@2.2.0
                      Properties:
                        Text: =Switch(varTicket.Status.Value, "New", "ยังไม่รับทราบ", "Acknowledged", "รับทราบแล้ว", "InProgress", "กำลังทำ", "WaitingCEO", "รอคุณตอบ", "Done", "ทำเสร็จ รอคุณตรวจ", "Closed", "ปิดแล้ว", varTicket.Status.Value)
                        OnSelect: =false
                        Font: =Font.'Open Sans'
                        Size: =13
                        FontWeight: =FontWeight.Bold
                        Fill: =Switch(true, varTicket.IsOpen && varTicket.Status.Value <> "Done" && varTicket.DueDate < Today(), ColorValue("#FDE8E8"), varTicket.Status.Value = "WaitingCEO", ColorValue("#E9E9F5"), varTicket.Status.Value = "Done", ColorValue("#E3F4EA"), varTicket.Status.Value = "New", ColorValue("#EEF0F4"), ColorValue("#F1F2F6"))
                        Color: =Switch(true, varTicket.IsOpen && varTicket.Status.Value <> "Done" && varTicket.DueDate < Today(), clrDanger, varTicket.Status.Value = "WaitingCEO", clrPrimary, varTicket.Status.Value = "Done", ColorValue("#17703A"), varTicket.Status.Value = "New", ColorValue("#3F4A5C"), ColorValue("#3F4A5C"))
                        BorderColor: =clrAccent
                        BorderThickness: =0
                        RadiusTopLeft: =20
                        RadiusTopRight: =20
                        RadiusBottomLeft: =20
                        RadiusBottomRight: =20
                        HoverFill: =Self.Fill
                        HoverColor: =Self.Color
                        HoverBorderColor: =Self.BorderColor
                        PressedFill: =Self.Fill
                        PressedColor: =Self.Color
                        PressedBorderColor: =Self.BorderColor
                        PaddingLeft: =8
                        PaddingRight: =8
                        Width: =Len(Self.Text) * 11 + 40
                        Height: =40
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Center
                        LayoutMinHeight: =0
                  - lblCDStatusDue:
                      Control: Label@2.5.1
                      Properties:
                        Text: ="ส่ง " & Text(varTicket.DueDate, "dddd d mmm", "th-TH") & If(varTicket.Status.Value in ["Done", "Closed"], If(IsBlank(varTicket.DoneAt) || varTicket.DoneAt < DateAdd(varTicket.DueDate, 1, TimeUnit.Days), " · ทันกำหนด", " · ช้า " & DateDiff(varTicket.DueDate, varTicket.DoneAt) & " วัน"), !varTicket.IsOpen, "", varTicket.DueDate < Today(), " · เลย " & DateDiff(varTicket.DueDate, Today()) & " วัน", varTicket.DueDate = Today(), " · วันนี้", " · อีก " & DateDiff(Today(), varTicket.DueDate) & " วัน")
                        Font: =Font.'Open Sans'
                        Size: =13
                        Color: =If(varTicket.IsOpen && varTicket.Status.Value <> "Done" && varTicket.DueDate < Today(), clrDanger, clrMuted)
                        Height: =40
                        FillPortions: =1
                        AlignInContainer: =AlignInContainer.Center
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
            - conCDInfo:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingTop: =12
                  PaddingBottom: =12
                  PaddingLeft: =18
                  PaddingRight: =18
                  LayoutGap: =6
                  DropShadow: =DropShadow.None
                  Fill: =Color.White
                  BorderThickness: =2
                  BorderColor: =clrLine
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =conCDWho.Height + 6 + conCDWhen.Height + If(conCDDetails.Visible, 6 + conCDDetails.Height, 0) + If(conCDExtra.Visible, 6 + conCDExtra.Height, 0) + 24 + 4
                Children:
                  - conCDWho:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =lblCDWho.Height + 0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblCDWhoK:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="ผู้รับงาน"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrMuted
                              Width: =140
                              FontWeight: =FontWeight.Normal
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              PaddingBottom: =2
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =140
                              Height: =Parent.Height - 0 - 0
                              LayoutMinHeight: =0
                        - lblCDWho:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =With({n: LookUp(colEmp, Lower(Email) = varTicket.AssigneeEmail).Nickname}, If(IsBlank(n), First(Split(varTicket.AssigneeEmail, "@")).Value, "คุณ" & n)) & With({d: LookUp(colEmp, Lower(Email) = varTicket.AssigneeEmail).Department}, If(IsBlank(d), "", " (" & d & ")"))
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrText
                              AutoHeight: =true
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              PaddingBottom: =2
                              FontWeight: =FontWeight.Semibold
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                  - conCDWhen:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =lblCDWhen.Height + 0
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblCDWhenK:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="สั่งเมื่อ"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrMuted
                              Width: =140
                              FontWeight: =FontWeight.Normal
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              PaddingBottom: =2
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =140
                              Height: =Parent.Height - 0 - 0
                              LayoutMinHeight: =0
                        - lblCDWhen:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(varTicket.Created, "d mmm hh:mm", "th-TH") & " ผ่าน " & varTicket.Source.Value
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrText
                              AutoHeight: =true
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              PaddingBottom: =2
                              FontWeight: =FontWeight.Normal
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                  - conCDDetails:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =lblCDDetails.Height + 0
                        Visible: =!IsBlank(varTicket.Details)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblCDDetailsK:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="รายละเอียด"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrMuted
                              Width: =140
                              FontWeight: =FontWeight.Normal
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              PaddingBottom: =2
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =140
                              Height: =Parent.Height - 0 - 0
                              LayoutMinHeight: =0
                        - lblCDDetails:
                            Control: Label@2.5.1
                            Properties:
                              Text: =varTicket.Details
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrText
                              AutoHeight: =true
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              PaddingBottom: =2
                              FontWeight: =FontWeight.Normal
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                  - conCDExtra:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Start
                        PaddingTop: =8
                        PaddingBottom: =8
                        PaddingLeft: =10
                        PaddingRight: =10
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Fill: =ColorFade(clrAccent, 92%)
                        BorderThickness: =2
                        Height: =lblCDExtra.Height + 16
                        BorderColor: =ColorFade(clrAccent, 50%)
                        RadiusTopLeft: =10
                        RadiusTopRight: =10
                        RadiusBottomLeft: =10
                        RadiusBottomRight: =10
                        Visible: =!IsBlank(varTicket.CEOExtra)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblCDExtraK:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="สั่งเพิ่ม"
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrDanger
                              Width: =140
                              FontWeight: =FontWeight.Semibold
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              PaddingBottom: =2
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =140
                              Height: =Parent.Height - 8 - 8
                              LayoutMinHeight: =0
                        - lblCDExtra:
                            Control: Label@2.5.1
                            Properties:
                              Text: =varTicket.CEOExtra
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrText
                              AutoHeight: =true
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              PaddingBottom: =2
                              FontWeight: =FontWeight.Normal
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
            - conCDFiles:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingTop: =12
                  PaddingBottom: =12
                  PaddingLeft: =18
                  PaddingRight: =18
                  LayoutGap: =8
                  DropShadow: =DropShadow.None
                  Fill: =Color.White
                  BorderThickness: =2
                  BorderColor: =clrLine
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =34 + 8 + If(galCDFiles.Visible, galCDFiles.Height, 40) + 24 + 4
                Children:
                  - conCDFilesHead:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =12
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =34
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblCDFilesHead:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="ไฟล์งาน (" & CountRows(Filter(varHist, StartsWith(Comment, "📎"))) & ")"
                              Font: =Font.'Open Sans'
                              Size: =15
                              Color: =clrText
                              Height: =34
                              FontWeight: =FontWeight.Bold
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - btnCDFolder:
                            Control: Classic/Button@2.2.0
                            Properties:
                              Text: ="เปิดโฟลเดอร์"
                              OnSelect: =Launch("https://digitalfocusth.sharepoint.com/sites/CEO-Tickets/TicketFiles/Forms/AllItems.aspx?id=" & EncodeUrl("/sites/CEO-Tickets/TicketFiles/T-" & varTicket.ID))
                              Font: =Font.'Open Sans'
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Fill: =Color.Transparent
                              Color: =clrPrimary
                              BorderColor: =clrAccent
                              BorderThickness: =0
                              RadiusTopLeft: =14
                              RadiusTopRight: =14
                              RadiusBottomLeft: =14
                              RadiusBottomRight: =14
                              HoverFill: =Color.Transparent
                              HoverColor: =clrAccent
                              HoverBorderColor: =Self.BorderColor
                              PressedFill: =Color.Transparent
                              PressedColor: =Self.Color
                              PressedBorderColor: =Self.BorderColor
                              Width: =190
                              Height: =34
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =4
                              Align: =Align.Right
                              PaddingRight: =0
                              DisabledFill: =Color.Transparent
                              DisabledColor: =ColorFade(clrPrimary, 60%)
                              DisplayMode: =If(varTicket.HasFiles || !IsEmpty(Filter(varHist, StartsWith(Comment, "📎"))), DisplayMode.Edit, DisplayMode.Disabled)
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =190
                              LayoutMinHeight: =0
                  - galCDFiles:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Items: =Filter(varHist, StartsWith(Comment, "📎"))
                        TemplateSize: =36
                        Fill: =Color.Transparent
                        ShowScrollbar: =false
                        Height: =CountRows(Self.AllItems) * 36
                        Visible: =!IsEmpty(Self.AllItems)
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - icogalCDFiles:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =Icon.Document
                              Color: =clrPrimary
                              OnSelect: =Select(Parent)
                              X: =0
                              Y: =6.0
                              Width: =24
                              Height: =24
                        - lblgalCDFilesName:
                            Control: Label@2.5.1
                            Properties:
                              Text: |-
                                =If(StartsWith(ThisItem.Comment, "📎 แนบไฟล์"), Mid(ThisItem.Comment, Find(": ", ThisItem.Comment) + 18), Trim(Mid(ThisItem.Comment, 3)))
                              Font: =Font.'Open Sans'
                              Size: =13
                              Color: =clrPrimary
                              X: =34
                              Y: =0
                              Width: =Parent.TemplateWidth - 34 - 150
                              Height: =36
                              Wrap: =false
                              OnSelect: =Select(Parent)
                        - lblgalCDFilesWhen:
                            Control: Label@2.5.1
                            Properties:
                              Text: =Text(ThisItem.Created, "d mmm hh:mm", "th-TH")
                              Font: =Font.'Open Sans'
                              Size: =12
                              Color: =clrMuted
                              X: =Parent.TemplateWidth - 146
                              Y: =0
                              Width: =146
                              Height: =36
                              Align: =Align.Right
                              OnSelect: =Select(Parent)
                  - lblCDFilesEmpty:
                      Control: Label@2.5.1
                      Properties:
                        Text: =If(varTicket.HasFiles, "มีไฟล์ในโฟลเดอร์งาน (รูปที่สั่งผ่าน LINE)", "ยังไม่มีไฟล์")
                        Font: =Font.'Open Sans'
                        Size: =13
                        Color: =clrMuted
                        Height: =40
                        Visible: =!galCDFiles.Visible
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
            - conCDHist:
                Control: GroupContainer@1.3.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingTop: =12
                  PaddingBottom: =12
                  PaddingLeft: =18
                  PaddingRight: =18
                  LayoutGap: =10
                  DropShadow: =DropShadow.None
                  Fill: =Color.White
                  BorderThickness: =2
                  BorderColor: =clrLine
                  RadiusTopLeft: =20
                  RadiusTopRight: =20
                  RadiusBottomLeft: =20
                  RadiusBottomRight: =20
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =34 + 10 + 92 + 24 + 4
                Children:
                  - conconCDHistHead:
                      Control: GroupContainer@1.3.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        LayoutGap: =4
                        DropShadow: =DropShadow.None
                        Fill: =Color.Transparent
                        BorderThickness: =0
                        Height: =34
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblCDHistHead:
                            Control: Label@2.5.1
                            Properties:
                              Text: ="ความเคลื่อนไหวล่าสุด"
                              Font: =Font.'Open Sans'
                              Size: =15
                              Color: =clrText
                              Height: =34
                              FontWeight: =FontWeight.Bold
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =2
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                        - lblCDHistHeadCount:
                            Control: Label@2.5.1
                            Properties:
                              Text: =If(CountRows(varHist) > 2, (varHistPos + 1) & "–" & Min(varHistPos + 2, CountRows(varHist)) & " / " & CountRows(varHist), "")
                              Font: =Font.'Open Sans'
                              Size: =12
                              Color: =clrMuted
                              Width: =110
                              Height: =34
                              Align: =Align.Right
                              VerticalAlign: =VerticalAlign.Top
                              PaddingTop: =6
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =110
                              LayoutMinHeight: =0
                        - icoconCDHistUp:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =Icon.ChevronUp
                              Color: =If(varHistPos > 0, clrPrimary, clrLine)
                              OnSelect: =If(varHistPos > 0, Set(varHistPos, varHistPos - 2))
                              Width: =40
                              Height: =34
                              PaddingTop: =6
                              PaddingBottom: =6
                              PaddingLeft: =8
                              PaddingRight: =8
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =40
                              LayoutMinHeight: =0
                        - icoconCDHistDown:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Icon: =Icon.ChevronDown
                              Color: =If(varHistPos + 2 < CountRows(varHist), clrPrimary, clrLine)
                              OnSelect: =If(varHistPos + 2 < CountRows(varHist), Set(varHistPos, varHistPos + 2))
                              Width: =40
                              Height: =34
                              PaddingTop: =6
                              PaddingBottom: =6
                              PaddingLeft: =8
                              PaddingRight: =8
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Start
                              LayoutMinWidth: =40
                              LayoutMinHeight: =0
                  - galCDHistory:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Items: =LastN(FirstN(varHist, varHistPos + 2), Max(Min(2, CountRows(varHist) - varHistPos), 0))
                        TemplateSize: =46
                        Fill: =Color.Transparent
                        ShowScrollbar: =false
                        Height: =92
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - lblCDHistWhen:
                            Control: Label@2.5.1
